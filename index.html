<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevMentor AI | Seu Tutor de Programação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        pre { background: #161b22; padding: 12px; border-radius: 8px; border: 1px solid #30363d; overflow-x: auto; color: #58a6ff; font-family: monospace; margin-top: 8px; margin-bottom: 8px; }
        code { font-family: monospace; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- HEADER / BARRA SUPERIOR -->
    <header class="bg-[#161b22] border-b border-[#30363d] px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-code"></i>
            </div>
            <div>
                <h1 class="font-bold text-white text-lg">DevMentor AI</h1>
                <p class="text-xs text-gray-400">Do Básico ao Avançado em Programação</p>
            </div>
        </div>

        <!-- CAMPO DA CHAVE DE API -->
        <div class="flex items-center gap-2">
            <input type="password" id="apiKeyInput" placeholder="Cole sua API Key aqui..." 
                class="bg-[#0d1117] border border-[#30363d] text-xs text-white px-3 py-2 rounded-lg w-64 focus:outline-none focus:border-blue-500">
            <button id="saveKeyBtn" onclick="saveKey()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition-all">
                Salvar Key
            </button>
        </div>
    </header>

    <!-- ÁREA DE MENSAGENS (CHAT) -->
    <main id="chatContainer" class="flex-1 overflow-y-auto chat-scroll p-6 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex gap-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 text-sm font-bold shrink-0">
                AI
            </div>
            <div class="bg-[#161b22] border border-[#30363d] p-4 rounded-2xl text-sm leading-relaxed max-w-2xl">
                <p class="font-bold text-blue-400 mb-1">Olá, Dev! Sou o seu DevMentor AI. 👋</p>
                <p class="text-gray-300 mb-2">Estou aqui para te ensinar programação do zero ao nível avançado.</p>
                <p class="text-xs text-gray-400">💡 Para começar: Cole sua <b>API Key gratuita do Gemini</b> no campo superior e clique em <b>Salvar Key</b>.</p>
            </div>
        </div>
    </main>

    <!-- INPUT DE MENSAGEM -->
    <footer class="bg-[#161b22] border-t border-[#30363d] p-4">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <input type="text" id="userInput" placeholder="Ex: 'Quero aprender JavaScript'..." 
                class="flex-1 bg-[#0d1117] border border-[#30363d] text-sm text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 transition-all placeholder-gray-500"
                onkeypress="if(event.key === 'Enter') sendMessage()">
            
            <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl transition-all font-bold flex items-center justify-center">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <script>
        const SYSTEM_PROMPT = `Você é o DevMentor AI, um tutor sênior e didático de programação web. Responda em Português do Brasil com conceitos simples, exemplos de código e exercícios.`;

        let apiKey = localStorage.getItem('gemini_api_key') || '';

        if(apiKey) {
            document.getElementById('apiKeyInput').value = apiKey;
        }

        function saveKey() {
            const input = document.getElementById('apiKeyInput').value.trim();
            if(input) {
                localStorage.setItem('gemini_api_key', input);
                apiKey = input;
                alert('Chave de API salva com sucesso!');
            } else {
                alert('Por favor, cole uma chave válida.');
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const message = inputEl.value.trim();

            if(!message) return;
            
            const currentInput = document.getElementById('apiKeyInput').value.trim();
            if(currentInput) {
                apiKey = currentInput;
                localStorage.setItem('gemini_api_key', apiKey);
            }

            if(!apiKey) {
                alert('Por favor, adicione sua API Key no campo superior e clique em Salvar Key!');
                return;
            }

            appendMessage('user', message);
            inputEl.value = '';

            const loadingId = appendLoading();

            const model = 'gemini-1.5-flash';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': apiKey 
                    },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: `${SYSTEM_PROMPT}\n\nAluno: ${message}` }] }]
                    })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    appendMessage('ai', data.candidates[0].content.parts[0].text);
                } else if (data.error) {
                    appendMessage('ai', `⚠️ Erro da API (${data.error.code}): ${data.error.message}`);
                } else {
                    appendMessage('ai', '⚠️ Não foi possível obter resposta. Tente novamente.');
                }
            } catch(e) {
                removeLoading(loadingId);
                appendMessage('ai', `❌ Erro na requisição: ${e.message}`);
            }
        }

        function appendMessage(sender, text) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex gap-3 ' + (sender === 'user' ? 'justify-end' : '');

            let formattedText = text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>').replace(/\n/g, '<br>');

            if(sender === 'user') {
                msgDiv.innerHTML = `<div class="bg-blue-600 text-white p-4 rounded-2xl text-sm leading-relaxed max-w-xl">${formattedText}</div>`;
            } else {
                msgDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 text-sm font-bold shrink-0">AI</div>
                    <div class="bg-[#161b22] border border-[#30363d] p-4 rounded-2xl text-sm leading-relaxed max-w-2xl text-gray-200">${formattedText}</div>`;
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function appendLoading() {
            const container = document.getElementById('chatContainer');
            const id = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'flex gap-3';
            loadingDiv.innerHTML = `
                <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 text-sm font-bold shrink-0">AI</div>
                <div class="bg-[#161b22] border border-[#30363d] p-4 rounded-2xl text-sm text-gray-400 flex items-center gap-2">
                    <i class="fa-solid fa-spinner animate-spin"></i> Aguarde, consultando o tutor...
                </div>`;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }
    </script>
</body>
</html>
